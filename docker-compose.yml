services:
  jobel-croquis:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - jobel_data:/data
      - ./CROQUI IA:/app/CROQUI IA:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
volumes:
  jobel_data:
